<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignifyAI - Hand Gesture Recognition</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SignifyAI</h1>
            <p>Real-time Hand Gesture Recognition</p>
        </header>
        
        <main>
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <div id="overlay">
                    <span id="prediction-label">Waiting...</span>
                    <!-- <span id="confidence-score"></span> -->
                </div>
                <canvas id="snapshot-canvas" style="display:none;"></canvas>
            </div>
            
            <div class="controls">
                <button id="toggle-cam" class="btn">Start Webcam</button>
                <div class="status-panel">
                    <p>Status: <span id="status">Ready</span></p>
                    <p>FPS: <span id="fps">0</span></p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by PyTorch & VGG16</p>
        </footer>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
